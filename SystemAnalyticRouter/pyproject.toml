[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "system-analytic-router"
version = "0.1.0"
description = "Authorized real-time router and local network analytics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9.8",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
sniff = ["scapy>=2.5.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
sarouter = "system_analytic_router.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/system_analytic_router/tests"]
pythonpath = ["src"]
